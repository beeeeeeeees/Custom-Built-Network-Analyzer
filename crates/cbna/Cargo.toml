[package]
name = "cbna"
description = "Custom Built Network Analyzer — capture, decode, and analyse network traffic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "cbna"
path = "src/main.rs"

[features]
default = []
# Enable live interface capture (`cbna devices`, `cbna capture`,
# `cbna serve --iface`). Requires libpcap/Npcap SDK at build time.
live = ["cbna-capture/live"]

[dependencies]
cbna-core.workspace = true
cbna-capture.workspace = true
cbna-web.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
