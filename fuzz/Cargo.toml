[package]
name = "cbna-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Its own workspace: the fuzz targets need nightly and a sanitizer profile, and
# folding them into the main workspace would drag that requirement onto every
# ordinary `cargo build`.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cbna-core = { path = "../crates/cbna-core" }
cbna-capture = { path = "../crates/cbna-capture" }
# default-features off: the feed parsers are fuzzed, not the network client, so
# the TLS stack stays out of the fuzz build.
cbna-intel = { path = "../crates/cbna-intel", default-features = false }

[profile.release]
debug = 1

[[bin]]
name = "decode_frame"
path = "fuzz_targets/decode_frame.rs"
test = false
doc = false

[[bin]]
name = "tls_hello"
path = "fuzz_targets/tls_hello.rs"
test = false
doc = false

[[bin]]
name = "dns_message"
path = "fuzz_targets/dns_message.rs"
test = false
doc = false

[[bin]]
name = "http_message"
path = "fuzz_targets/http_message.rs"
test = false
doc = false

[[bin]]
name = "capture_file"
path = "fuzz_targets/capture_file.rs"
test = false
doc = false

[[bin]]
name = "tcp_stream"
path = "fuzz_targets/tcp_stream.rs"
test = false
doc = false

[[bin]]
name = "ip_reassembly"
path = "fuzz_targets/ip_reassembly.rs"
test = false
doc = false

[[bin]]
name = "ioc_list"
path = "fuzz_targets/ioc_list.rs"
test = false
doc = false

[[bin]]
name = "feed_parse"
path = "fuzz_targets/feed_parse.rs"
test = false
doc = false
