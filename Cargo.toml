[workspace]
resolver = "2"
members = [
    "crates/cbna-core",
    "crates/cbna-capture",
    "crates/cbna-web",
    "crates/cbna-intel",
    "crates/cbna",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
cbna-core = { path = "crates/cbna-core" }
cbna-capture = { path = "crates/cbna-capture" }
cbna-web = { path = "crates/cbna-web" }
cbna-intel = { path = "crates/cbna-intel" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
pcap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
